<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 68" role="img" aria-label="Précis-Méca — Usinage Haute Précision">
  
  <defs>
    <linearGradient id="bronzeRibbonA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C5D1E"/>
      <stop offset="28%" stop-color="#D4A24E"/>
      <stop offset="56%" stop-color="#F6E299"/>
      <stop offset="82%" stop-color="#C8923E"/>
      <stop offset="100%" stop-color="#80531A"/>
    </linearGradient>
    <linearGradient id="bronzeRibbonB" x1="15%" y1="100%" x2="85%" y2="0%">
      <stop offset="0%" stop-color="#764B14"/>
      <stop offset="40%" stop-color="#BD8736"/>
      <stop offset="72%" stop-color="#F0D788"/>
      <stop offset="100%" stop-color="#A6742A"/>
