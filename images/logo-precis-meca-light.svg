  <line x1="138" y1="11" x2="138" y2="57" stroke="#9A6B25" stroke-width="1.2" stroke-opacity="0.4"/>
  <text x="152" y="38" fill="#14171B" font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2.8">PRÉCIS-MÉCA</text>
  <text x="153" y="55" fill="#8C5D1E" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="9" font-weight="600" letter-spacing="0.95">USINAGE HAUTE PRÉCISION · DEPUIS 1986</text>
</svg>