    <path d="M 1.2,4 L 31.2,4 C 41.6,4 47.6,10.8 47.6,20.5 C 47.6,24.8 46.6,28.4 44.8,31.2 C 42.4,24.6 36.8,21.4 28.6,21.4 L 12.2,21.4 L 12.2,14.4 L 30.2,14.4 C 34.4,14.4 37.0,16.1 38.0,19.4 C 37.4,12.5 32.5,10.6 25.0,10.6 L 1.2,10.6 Z" fill="url(#bronzeRibbonB)" stroke="url(#bronzeStroke)" stroke-width="0.4"/>
    <!-- P: smooth folded ribbon wrapping left edge into center waist -->
