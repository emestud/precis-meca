    <!-- M: left diagonal ribbon folding around valley -->
    <path d="M 55.2,4 L 61.5,4 C 64.5,4 66.8,5.6 68.8,8.4 L 86.4,34.4 C 89.4,38.8 92.6,41.2 96.4,41.6 L 91.2,51.2 C 88.5,56.2 85.4,59.5 81.4,59.5 C 77.6,59.5 74.6,56.4 71.2,51.4 L 55.2,27.6 Z" fill="url(#bronzeRibbonA)" stroke="url(#bronzeStroke)" stroke-width="0.4"/>
    <!-- M: right diagonal sweeping cleanly into valley fold -->
    <path d="M 115.2,4 L 108.8,4 C 105.8,4 103.5,5.6 101.4,8.6 L 83.2,35.4 C 86.2,39.8 89.2,42.4 92.8,43.2 L 103.2,27.8 L 115.2,15.5 Z" fill="url(#bronzeRibbonC)" stroke="url(#bronzeStroke)" stroke-width="0.4"/>
