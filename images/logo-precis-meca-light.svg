      <stop offset="50%" stop-color="#C99646" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F6E299" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <path d="M 2,10 L 2,3 L 9,3 M 121,3 L 128,3 L 128,10 M 2,58 L 2,65 L 9,65 M 121,65 L 128,65 L 128,58" fill="none" stroke="#9A6B25" stroke-width="1.2" stroke-opacity="0.7"/>
  <g transform="translate(6,4) scale(0.98)">
