      <stop offset="48%" stop-color="#F7E49E"/>
      <stop offset="100%" stop-color="#C28D3B"/>
    </linearGradient>
    <linearGradient id="bronzeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
